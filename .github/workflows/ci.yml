name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: Code Style and Meta Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      # Unity プロジェクトでは .sln がないため、ディレクトリ単位でのチェックを行う。
      # sln/csproj が必要な dotnet format の代わりに、まずホワイトスペース等の基本チェックを行うか、
      # 必要であればプロジェクトを簡易生成する。ここでは一旦基本チェックに留める。
      - name: Basic Style Check
        run: |
          echo "Checking whitespace and basics in Assets..."
          # dotnet format whitespace をディレクトリ指定で実行 (csprojがない場合の代替案)
          # エラーが出やすい場合は echo での警告に留め、メタチェックを優先する
          dotnet format whitespace Assets --verify-no-changes || echo "Style check found issues."

  meta-check:
    name: Meta File Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for missing .meta files
        run: |
          # アセットフォルダ内の全ファイルをリストし、対応する .meta ファイルが存在するか確認する
          # .git や Packages, ProjectSettings 以外（主に Assets）を対象
          EXIT_CODE=0
          find Assets -name "*" ! -name "*.meta" -type f | while read file; do
            if [ ! -f "$file.meta" ]; then
              echo "Error: Missing .meta file for $file"
              EXIT_CODE=1
            fi
          done
          
          # フォルダ自体の .meta ファイルもチェック
          find Assets -type d | while read dir; do
            if [ "$dir" != "Assets" ] && [ ! -f "$dir.meta" ]; then
              echo "Error: Missing .meta file for directory $dir"
              EXIT_CODE=1
            fi
          done
          
          if [ $EXIT_CODE -ne 0 ]; then
            exit 1
          fi
          echo "Meta file check passed."
